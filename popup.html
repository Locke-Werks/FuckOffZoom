<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FuckOffZoom</title>
    <style>
      :root {
        --bg: #151517;
        --panel: #1c1c20;
        --line: #2e2e35;
        --text: #e6e6ea;
        --dim: #9a9aa6;
        --accent: #d6262a;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        width: 296px;
        font: 13px/1.45 ui-sans-serif, "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 14px 16px 12px;
        border-bottom: 1px solid var(--line);
      }
      header img { width: 22px; height: 22px; }
      header h1 { font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
      header .ver { margin-left: auto; font-size: 11px; color: var(--dim); }
      main { padding: 6px 16px 14px; }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
      }
      .row:last-of-type { border-bottom: 0; }
      .row label { flex: 1; cursor: pointer; }
      .row .sub { display: block; font-size: 11px; color: var(--dim); }
      .master { font-weight: 600; }
      input[type="checkbox"] {
        width: 15px; height: 15px; flex: none;
        accent-color: var(--accent); cursor: pointer;
      }
      input[type="number"] {
        width: 54px; padding: 5px 7px;
        font: inherit; font-variant-numeric: tabular-nums; text-align: center;
        border: 1px solid var(--line); border-radius: 7px;
        background: var(--panel); color: var(--text);
      }
      input[type="number"]:focus { outline: 1px solid var(--accent); }
      footer {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        border-top: 1px solid var(--line);
        background: var(--panel);
      }
      #count { flex: 1; font-size: 11px; color: var(--dim); }
      button {
        font: inherit; font-size: 12px; font-weight: 600;
        padding: 6px 11px; border-radius: 7px; cursor: pointer;
        border: 1px solid var(--line); background: #24242a; color: var(--text);
      }
      button:hover { background: #2c2c33; }
      button:disabled { opacity: .5; cursor: default; }
      .disabled { opacity: .4; pointer-events: none; }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon48.png" alt="" />
      <h1>FuckOffZoom</h1>
      <span class="ver" id="version"></span>
    </header>

    <main>
      <div class="row master">
        <label for="enabled">Close Zoom tabs</label>
        <input type="checkbox" id="enabled" />
      </div>

      <div id="body">
        <div class="row">
          <label for="delay">
            Wait before closing
            <span class="sub">Give the desktop client time to take over.</span>
          </label>
          <input type="number" id="delay" min="1" max="60" step="1" />
        </div>

        <div class="row">
          <label for="closeLaunch">
            Meeting launch tabs
            <span class="sub">/j/, /s/, /w/, /my/, /launch/</span>
          </label>
          <input type="checkbox" id="closeLaunch" />
        </div>

        <div class="row">
          <label for="closePostMeeting">
            Post-meeting tabs
            <span class="sub">The page Zoom leaves behind afterwards.</span>
          </label>
          <input type="checkbox" id="closePostMeeting" />
        </div>

        <div class="row">
          <label for="showBanner">
            Countdown banner
            <span class="sub">With a button to keep the tab.</span>
          </label>
          <input type="checkbox" id="showBanner" />
        </div>
      </div>
    </main>

    <footer>
      <span id="count"></span>
      <button id="sweep">Sweep open tabs</button>
    </footer>

    <script src="common.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
